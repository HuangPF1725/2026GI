<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消化系刷題小程式</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--text:#1d2433;--muted:#667085;--line:#e3e7ee;
  --primary:#2f6fed;--primary-soft:#e8efff;--ok:#16a34a;--ok-soft:#e6f6ec;--bad:#dc2626;--bad-soft:#fdeaea;--warn:#b45309;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c;--card:#1b1f29;--text:#e8ebf2;--muted:#98a2b3;--line:#2c3240;
  --primary:#6b95ff;--primary-soft:#232d4a;--ok:#4ade80;--ok-soft:#173326;--bad:#f87171;--bad-soft:#3a1f22;--warn:#fbbf24;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;user-select:none}
.chip input{width:18px;height:18px;accent-color:var(--primary)}
.chip .n{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.chip.on{border-color:var(--primary);background:var(--primary-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--text);padding:8px 14px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--primary);color:#fff}
.btn{border:0;background:var(--primary);color:#fff;padding:11px 20px;border-radius:10px;font-size:15px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--primary);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px;gap:8px}
.tag{background:var(--primary-soft);color:var(--primary);padding:2px 8px;border-radius:99px;font-size:12px}
.q{font-size:17px;font-weight:600;white-space:pre-line;margin-bottom:14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:15px;font-family:inherit;white-space:pre-line}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt b{min-width:20px;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px;white-space:pre-line}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb strong{display:block;margin-bottom:4px}
.score{font-size:48px;font-weight:800;text-align:center;margin:4px 0}
.score small{font-size:18px;color:var(--muted)}
.wl{border-top:1px solid var(--line);padding:12px 0;font-size:14px}
.wl .qq{font-weight:600;white-space:pre-line}
.wl .ans{color:var(--ok)}
.wl .you{color:var(--bad)}
.hidden{display:none}
.stat{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}
a.link{color:var(--primary);cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>🩺 消化系刷題小程式</h1><div class="sub">共 <span id="total"></span> 題 · 即時對答案 · 自動記錄錯題</div></div>
  </header>

  <!-- 設定畫面 -->
  <section id="setup">
    <div class="card">
      <h2>選擇單元</h2>
      <div class="chips" id="chips"></div>
      <div style="margin-top:10px"><a class="link" id="selAll">全選</a> · <a class="link" id="selNone">全不選</a></div>
    </div>
    <div class="card">
      <h2>出題方式</h2>
      <div class="row">
        <div class="seg" id="modeSeg">
          <button data-v="order" class="on">依序</button>
          <button data-v="random">隨機</button>
        </div>
        <div class="seg" id="srcSeg">
          <button data-v="all" class="on">全部題目</button>
          <button data-v="wrong">只刷錯題</button>
        </div>
      </div>
      <div class="stat"><span>累積錯題：<b id="wrongCount">0</b> 題</span><a class="link" id="clearWrong">清除錯題記錄</a></div>
    </div>
    <div class="actions"><button class="btn" id="start">開始刷題</button></div>
  </section>

  <!-- 作答畫面 -->
  <section id="quiz" class="hidden">
    <div class="bar"><i id="pbar"></i></div>
    <div class="meta"><span id="pos"></span><span class="tag" id="secTag"></span></div>
    <div class="card">
      <div class="q" id="qtext"></div>
      <div id="opts"></div>
      <div id="fb"></div>
    </div>
    <div class="actions">
      <button class="btn" id="next" disabled>下一題</button>
      <button class="btn ghost" id="quit">結束</button>
    </div>
  </section>

  <!-- 結果畫面 -->
  <section id="result" class="hidden">
    <div class="card">
      <div class="score"><span id="rScore"></span><small> / <span id="rTotal"></span></small></div>
      <div style="text-align:center" class="sub" id="rPct"></div>
    </div>
    <div class="card" id="wrongBox">
      <h2>本次錯題</h2>
      <div id="wrongList"></div>
    </div>
    <div class="actions">
      <button class="btn" id="retryWrong">重刷本次錯題</button>
      <button class="btn ghost" id="home">回首頁</button>
    </div>
  </section>
</div>

<script>
const LET="ABCDE";
const DATA=[
{name:"上消化道出血／抗凝血藥物",qs:[
{q:"Which of the following is the preferred reversal agent for dabigatran in a patient with active GI bleeding?",o:["Protamine sulfate","Vitamin K","Idarucizumab","Andexanet alfa","PCC"],a:2},
{q:"According to ESGE guidelines, when should endoscopy ideally be performed in a hemodynamically stable patient with AGIB?",o:["Within 6 hours","Within 12 hours","Within 24 hours","After 48 hours","Only after full anticoagulant reversal"],a:2},
{q:"In which of the following scenarios is aspirin most likely to be continued during active GI bleeding?",o:["Primary prevention of cardiovascular disease","Secondary prevention post-stent placement","Chemoprevention of colorectal cancer","Osteoporosis","Prophylaxis for venous thromboembolism"],a:1},
{q:"What is the recommended management for warfarin-associated major GI bleeding?",o:["Stop warfarin and give aspirin","Administer idarucizumab","Stop warfarin and give PCC + vitamin K","Hold warfarin and monitor INR only","Switch to DOAC immediately"],a:2},
{q:"Which factor most influences the decision to restart anticoagulation after GI bleeding?",o:["Patient age","Hospital length of stay","Hemoglobin level","Balance between thromboembolic and rebleeding risk","Type of anesthesia used during endoscopy"],a:3}
]},
{name:"肝癌全身性治療",qs:[
{q:"在肝癌的systemic therapy治療機轉中，下列何者描述是正確的?\n(1) Cabozantinib是一種anti-PD1抗體\n(2) Durvalumab是一種anti-PD-L1抗體\n(3) Bevacizumab是一種anti-VEGF抗體\n(4) Tremelimumab是一種anti-CTLA4抗體\n(5) Atezolizumab是一種anti-PD1抗體",o:["(1)+(2)+(3)","(2)+(3)+(4)","(1)+(3)+(5)","(2)+(4)+(5)","(3)+(4)+(5)"],a:1,e:"Cabozantinib is a MET, VEGFR2 and RET inhibitor approved for thyroid, renal cancer and HCC。Atezolizumab 為 anti-PD-L1。"},
{q:"在肝癌的systemic therapy 中，下列何者是屬於一線Sorafenib治療失敗後已有多個國際肝癌治療準則建議的第二線治療藥物?\n1. Lenvatinib\n2. Cabozanitib\n3. Atezolizumab + Bevacizumab\n4. Regorafenib\n5. Pembrolizumab",o:["(1)+(2)+(3)","(1)+(3)+(4)","(2)+(4)+(5)","(2)+(3)+(4)","(3)+(4)+(5)"],a:2},
{q:"根據美國肝臟醫學會(AASLD) 2023年及歐洲肝臟醫學會(EASL) 2025年治療指引，對於中期肝癌的患者，不建議採用下列何種處置？",o:["TACE仍是目前中期肝癌最佳實證治療的首選","可考慮合併全身系統性治療 (systemic therapy) 加上TACE","對於不適合接受TACE的病患可考慮採用全身系統性治療","目前中期肝癌比較有證據的是EMERALD-1試驗","DEB-TACE和cTACE並無證據顯示有療效上的差異"],a:1},
{q:"關於晚期肝癌第一線治療的說法，何者正確？",o:["sorafenib是唯一可用的第一線藥物","tremelimumab + durvalumab僅適用於AFP>400 ng/mL","atezolizumab + bevacizumab需避免用於高出血風險病人","nivolumab + ipilimumab已不再使用於第一線治療","lenvatinib對於延緩腫瘤進展時間無明顯幫助"],a:2},
{q:"根據IMbrave050試驗，術後接受atezolizumab與bevacizumab作為adjuvant 治療的病人，其研究結果下列哪項是正確？",o:["有效減少肝臟毒性但不影響復發率","初期無疾病存活期(recurrence-free survival)改善，但長期追蹤效果未持續","可以明顯延長整體存活時間並已納入所有國際治療指引中","主要針對AFP正常者效果顯著","不適用於接受局部燒灼術的病人"],a:1}
]},
{name:"急性胰臟炎",qs:[
{q:"根據 2012 年修訂版亞特蘭大分類 (Revised Atlanta Classification, RAC)，區分「重症急性胰臟炎」(Severe Acute Pancreatitis) 與「中重症急性胰臟炎」(Moderately Severe Acute Pancreatitis) 的核心定義為何？",o:["影像學上是否存在廣泛的胰臟壞死 (Necrosis)","入院 24 小時內是否出現全身性發炎反應症候群 (SIRS)","器官衰竭 (Organ Failure) 是否持續超過 48 小時","血清脂肪酶 (Lipase) 數值是否高於正常上限 10 倍","是否出現暫時性的器官衰竭並在 48 小時內恢復"],a:2},
{q:"根據指標性的 WATERFALL 試驗 與 2025 International Association of Pancreatology (IAP)最新指南，對於急性胰臟炎患者的早期液體復甦，下列敘述何者正確？",o:["為了預防胰臟壞死，所有患者皆應採取積極補液 (Aggressive hydration)，初始給予 20 mL/kg 快速輸液","推薦使用「適度補液」(Moderate hydration) 策略，對無脫水者以 1.5 mL/kg/h 維持，以降低容量負荷過重 (Fluid overload) 的風險","應在 48 小時內強制進行快速血液稀釋，將血球容積比 (HCT) 降至 35% 以下以改善微循環","生理食鹽水 (Normal Saline) 因能提升 pH 值，在減輕全身性發炎方面優於乳酸林格氏液 (Lactated Ringer's)","僅有合併慢性腎臟病的患者需要監測容量負荷過重，一般患者應儘可能大量補液"],a:1},
{q:"當前對於胰臟炎患者的營養管理觀念已轉向「腸道激活」(Gut rousing)。對於重症急性胰臟炎患者，下列何者是目前循證醫學推薦的首選營養策略？",o:["必須禁食 (NPO) 直到腹痛完全消失且血清澱粉酶/脂肪酶恢復正常","為確保胰臟得到完全休息，應在入院 24 小時內啟動全靜脈營養 (TPN)","若無法口服，應儘早（24-72 小時內）啟動「腸內營養」(Enteral Nutrition)，以維持腸黏膜屏障並防止細菌易位","腸內營養必須由鼻腸管 (NJ tube) 進入空腸，以避免胃部進食刺激胰臟分泌","初始進食應嚴格遵循從清流質、全流質到固體食物的階梯式調整"],a:2},
{q:"對於急性膽石性胰臟炎 (Acute Biliary Pancreatitis) 患者，根據各大國際學會指引，下列哪一種情境是執行緊急 ERCP (24 小時內) 的絕對適應症？",o:["影像學顯示膽囊內有結石，但總膽管直徑正常且無黃疸跡象","預測為重症胰臟炎，但臨床上查無膽管炎或膽管持續阻塞之證據","合併有急性膽管炎 (Acute Cholangitis) 或持續性的膽管阻塞 (Biliary Obstruction)","患者入院時 ALT 數值大於 150 U/L，高度懷疑為膽石性病因","所有的膽石性胰臟炎患者，無論臨床症狀，皆應在 72 小時內完成 ERCP 以預防惡化"],a:2}
]},
{name:"食道高解析壓力檢查 HRM／Achalasia",qs:[
{q:"A 47-year-old woman, obese, presents with a 7-year history of GERD and a 6-month history of nocturnal heartburn. When she leans forward, she tends to regurgitate fluid easily. Her heartburn is better with BID PPI, but the regurgitation is bothersome for her. She denies any dysphagia and has gained weight recently. An upper endoscopy shows LA grade 2 erosive esophagitis. The stomach and duodenum are normal. A high-resolution manometry study was performed. What is your diagnosis?",o:["Hiatal hernia","Impaired esophageal peristalsis","Diffuse esophageal spasm","Hypertensive upper esophageal sphincter","Achalasia"],a:0},
{q:"有關食道賁門失弛緩症（賁門不張）（achalasia）的敘述，何者不正確？\n(1) Manometry 常見 aperistalsis，下食道括約肌 resting LESP 高，relaxation 放鬆不全之變化。\n(2) 病人固體及液體食物皆吞嚥困難，平躺時易有 acid regurgitation 及 heart burn。\n(3) 口服 Nitrate 或 calcium channel blocker（nifedipine、diltiazem、verapamil）可減緩輕症病人之症狀。\n(4) Barium esophagogram 可見食道擴大，\"bird's beak\"及 air in stomach fundus 等情形。\n(5) 近年來 POEM、Botox A Injection、pneumatic balloon dilation 已有很好的成效，但仍無法完全取代 Esophagomyotomy（Heller's cardiomyotomy）的外科治療。",o:["(1)＋(3)","(2)＋(4)","(3)＋(5)","(1)＋(4)","(4)＋(5)"],a:1},
{q:"以下關於食道弛緩不能症（achalasia）之描述何者正確？\n(1) 患者主要是漸進式的吞嚥困難，有時也會感覺胸痛、食物逆流等不適，上消化道內視鏡檢查下不易被診斷出來，胃鏡通常仍能順利通過下食道括約肌，除非食道已相當擴大或有食物經禁食 6-8小時後仍殘留於食道\n(2) 鋇劑食道攝影可以發現食道上端明顯變寬，食道與胃交接處狹窄，看起來「鳥嘴」的形狀（bird's beak）\n(3) 依照芝加哥分類，高解析度食道壓力檢測的結果將食道弛緩不能分為三種亞型，其中第一型特色為遠端食道痙攣收縮（spastic contractions）比例達到 20%以上，最少見，治療效果也最差\n(4) 當患者吞嚥困難症狀持續時間較短或合併顯著體重減輕時，必須考慮假性食道弛緩不能的可能性\n(5) 經口內視鏡食道肌肉切開術（POEM）目前在國內外已成為治療主流，治療食道弛緩不能之效果顯著，安全性亦高",o:["(1)＋(2)＋(3)","(2)＋(3)＋(4)","(1)＋(3)＋(4)","(1)＋(3)＋(4)＋(5)","(1)＋(2)＋(4)＋(5)"],a:4},
{q:"30歲女性病人，主訴近一年來開始出現食物逆流情形，容易嗝氣，有時吞嚥時會卡卡的，曾去附近診所求診，醫師告知可能是胃食道逆流，但是藥物治療反應不佳。最近三個月來吞嚥愈來愈困難，感覺固體或液體食物皆會卡在食道，容易噁心及食慾下降，體重減輕超過十公斤。進一步上消化道內視鏡檢查發現食道管徑明顯擴大，食物殘留，胃食道交接處較緊，但沒有明顯腫瘤。上消化道鋇劑攝影則是發現大量鋇劑堆積於擴大的食道，胃食道交接處有鳥嘴特徵（bird beak sign），高解析度食道壓力檢查（HRM）發現下食道括約肌在吞水試驗時放鬆壓力（relaxation pressure）過高，食道完全沒有蠕動，全段食道壓力上升（pan-esophageal pressurization）比例為 30%。以上關於這位病人的臨床評估，何者正確？\n(1) 芝加哥分類為第一型 achalasia\n(2) 芝加哥分類為第二型 achalasia\n(3) 芝加哥分類為食道胃交接外流處阻塞（EGJ outflow obstruction）\n(4) 考慮安排內視鏡超音波或電腦斷層排除假性食道弛緩不能（pseudoachalasia）的可能性\n(5) 目前在國內外的治療主流為 POEM，治療效果顯著，安全性亦高",o:["(1)＋(4)＋(5)","(2)＋(4)＋(5)","(3)＋(4)＋(5)","(1)＋(4)","(2)＋(5)"],a:1},
{q:"A 28-year-old man is diagnosed with achalasia type II on a high-resolution esophageal manometry performed for evaluation of nonobstructive dysphagia. Which of the following manometric findings would you expect to find in his study?",o:["Median integrated relaxation pressure (IRP) 28 mm Hg with absent peristalsis and panesophageal pressurization","Median IRP 7 mm Hg with absent peristalsis","Median IRP 21 mm Hg with premature distal esophageal contractions","Median IRP 19 mm Hg with weak peristalsis","Median IRP 31 mm Hg with absent peristalsis"],a:0},
{q:"A 47-year-old woman presents to your clinic with chest pain and dysphagia. A barium esophagram shows corkscrew contractions in the distal esophagus as well as narrowing at the esophagogastric junction (EGJ). Based on the diagnosis made on high-resolution manometry, you send the patient for a per-oral endoscopic myotomy (POEM) procedure, at which time a 10 cm long esophageal myotomy is performed. What is the most likely diagnosis?",o:["Type I achalasia","Esophagogastric junction outflow obstruction","Distal esophageal spasm","Type III achalasia","Type II achalasia"],a:3},
{q:"A 35-year-old woman with atypical chest pain and dysphagia is referred for esophageal manometry (原題附圖). DCI is 12,909 mmHg with repetitive esophageal contractions and an IRP of 10.3. Distal latency is 6s. What is the diagnosis in this case:",o:["Hypercontractile esophagus","Distal esophageal spasm","Type III Achalasia","Jackhammer esophagus","A and D are correct"],a:4},
{q:"62歲女性病人，5年前診斷出有硬皮症（scleroderma）而於風濕免疫科治療與規律追蹤，沒有菸酒檳榔等壞習慣。病人長期為胃食道逆流症狀所苦，特別是晚上就寢躺平時特別嚴重，胃鏡檢查也發現有嚴重糜爛性食道炎，洛杉磯分類 C級，關於這位病人的進一步臨床評估與治療，何者正確？\n(1) HRM下常見食道收縮力過強 Hypercontractile esophagus（Jackhammer esophagus）。\n(2) HRM下常見食道收縮力缺乏（absent contractility）或無效的食道蠕動（ineffective esophageal motility）。\n(3) 下食道括約肌的靜止壓力及放鬆時壓力通常偏高。\n(4) 內視鏡追蹤檢查時必須注意觀察是否出現糜爛性食道炎之併發症，如巴瑞特氏食道、食道腺癌或管腔狹窄。\n(5) 治療方面主要是以 PPI 強力抑制胃酸分泌及配合生活作息的調整達到減少胃酸逆流的目的。",o:["(2)＋(3)＋(4)","(1)＋(4)＋(5)","(2)＋(4)＋(5)","(1)＋(3)＋(5)","(1)＋(2)＋(4)"],a:2}
]},
{name:"IBD 臨床照護",qs:[
{q:"下列有關於 IBD 患者癌症監測的敘述，何者正確？",o:["所有 UC 患者應於診斷後即進行結腸鏡檢查以評估癌症風險","使用 anti-TNF-α 治療的患者無需接受皮膚癌篩檢","HPV 疫苗不建議給 27–45 歲 IBD 患者","所有女性 IBD 患者僅需每 5 年接受一次 Pap smear","用 anti-TNF-α 藥物者皮膚黑色素瘤風險上升，建議每年檢查"],a:4,e:"抗 TNF-α 藥物（如 infliximab、adalimumab）與非黑色素瘤及黑色素瘤風險上升有關，建議每年至少進行一次皮膚癌檢查。UC 一般於發病 8–10 年後開始定期結腸鏡檢查；HPV 疫苗建議可用於 IBD 患者（含27–45歲）；子宮頸癌篩檢建議並非只需5年一次。"},
{q:"下列何者為 IBD 患者接受骨質疏鬆篩檢（DEXA）的適應症？",o:["BMI > 30 kg/m²","純粹接受 anti-IL23 單株抗體者無其他風險因子","男性年齡 > 50 歲，且有吸菸習慣","無骨折病史之年輕女性患者","短期使用類固醇小於 1 個月者"],a:2,e:"IBD 患者若為男性 > 50 歲且有吸菸習慣，屬於骨質疏鬆高風險族群，建議進行 DEXA。高 BMI 非主要適應症；anti-IL23 並非骨質高風險因子；無風險因子的年輕女性不需常規 DEXA；類固醇使用需≥3個月且累積劑量達相當程度才列為骨質疏鬆因子。"},
{q:"關於使用免疫抑制性藥物之 IBD 患者的疫苗接種，下列何者正確？",o:["活性減毒的 MMR 疫苗可於任何時候施打，不需考量免疫狀態","高劑量流感疫苗僅建議使用於 18–64 歲健康成人","COVID-19 疫苗應避免使用 mRNA 類型於 IBD 患者","肺炎鏈球菌疫苗應先施打 PPSV23，再施打 PCV20","肺炎鏈球菌疫苗接種應先施打 PCV20，至少 8 週後再接種 PPSV23"],a:4,e:"IBD 免疫抑制劑者建議先接種 PCV20，若尚未打 PPSV23，應至少間隔 8 週。MMR 為活性減毒疫苗，免疫抑制者不建議施打；高劑量流感疫苗主要建議≥65歲或高風險族群；mRNA COVID-19 疫苗非活性疫苗，可安全接種。"},
{q:"關於 IBD 患者的心理與精神健康照護，下列何者正確？",o:["Patient Health Questionnaire (PHQ-9) 量表主要用於焦慮篩檢，適用於新診斷 IBD 患者","IBD 患者接受正念減壓訓練 (MBSR) 可降低發炎指標如 CRP","Selective serotonin reuptake inhibitors (SSRIs) 應避免使用於 IBD 患者，因可能干擾免疫功能","IBD 患者無須進行心理篩檢，除非出現明顯精神疾病病徵","認知行為治療 (CBT) 僅適用於青少年 IBD 患者，成人效果不明確"],a:1,e:"MBSR 可改善壓力、焦慮與憂鬱，並有研究顯示可降低 CRP 等發炎指標。PHQ-9 主要用於憂鬱症篩檢（焦慮常用 GAD-7）；SSRIs 一般可安全使用於 IBD；IBD 患者建議常規心理篩檢；CBT 對成人 IBD 患者亦有效。"},
{q:"關於 IBD 患者的營養與代謝管理，下列何者正確？",o:["對於有活動性病灶的患者，首選使用高蛋白靜脈營養 (TPN) 以減少腸道負擔","對於小腸切除或膽汁滯積的患者，應定期監測水溶性維生素","維生素 D 補充的建議劑量為每日 200–400 IU，避免過量","Mediterranean（地中海）飲食具有抗發炎特性，可降低 CRP，對 IBD 患者有益","鐵劑治療首選口服補充劑，即使在中重度貧血患者中亦然"],a:3,e:"地中海飲食富含蔬果、全穀、橄欖油、魚類，具抗發炎特性，可降低 CRP 並改善腸道菌相。活動性病灶首選腸道營養(EN)；小腸切除/膽汁滯積者需監測「脂溶性」維生素；維生素 D 通常需 800–2000 IU/日；中重度貧血(Hb < 10 g/dL)或口服耐受差時建議靜脈鐵劑。"}

{name:"ACLF 臨床指引與病理機轉",qs:[
{q:"關於慢性肝衰竭急性發作 (ACLF) 病患出現「免疫麻痺 (Immune paresis)」的病理生理機轉，下列敘述何者最為正確？",o:["主要肇因於巨噬細胞內的發炎體 (Inflammasome) 過度活化，導致吞噬功能呈現不受控的亢進。","由於腸道致病菌大量進入血液，直接毒殺血液中的單核球，導致人體免疫細胞數量急遽減少至耗竭。","免疫細胞的代謝途徑從低效的糖解作用被迫轉向粒線體氧化磷酸化 (OXPHOS)，造成能量過度消耗。","免疫細胞因代謝重塑 (Metabolic reprogramming) 轉向糖解作用，導致生物能量衰竭 (ATP 不足)，無法執行吞噬與殺菌任務。","高血氨直接破壞了白血球的細胞膜結構，使其完全失去抗原呈現的能力。"],a:3,e:"ACLF 初期為過度發炎，後期出現免疫麻痺。免疫細胞因代謝重塑轉向高糖解作用，導致粒線體功能障礙與 ATP 不足，影響吞噬、殺菌與抗原呈現能力；並非數量耗竭，而是功能失調。"},
{q:"2025 年發表的「京都共識 (Kyoto Consensus)」將 ACLF 廣義分為 Type A 與 Type B，下列關於此兩型的比較何者正確？",o:["Type A 強調以肝外器官衰竭 (EHOF) 為核心表現，主要對應傳統歐美 EASL-CLIF 的診斷標準。","Type B 必須以肝功能衰竭（血清總膽紅素 > 5 mg/dL 且 INR ≥ 1.5）為診斷的絕對首要條件。","Type A 嚴格排除過去曾有嚴重肝臟失代償病史的患者，強調首次發生的急性發作。","Type B 認為細菌感染多為 ACLF 發生後因免疫麻痺所導致的「後續併發症」，通常不是直接的誘發因子。","Type A 的嚴重度分級主要是計算全身衰竭器官的數量，分為 Grade 1 到 3。"],a:2,e:"Type A：無嚴重肝臟失代償病史，首次急性發作；Type B：既往已有肝臟失代償病史，急性惡化。Type B 並非以膽紅素/INR 作為絕對條件，感染仍是重要誘發因子；Kyoto 共識並未採用與 EASL-CLIF 相同的嚴重度分級方式。"},
{q:"根據近年的多中心流行病學數據，關於亞洲地區 ACLF 急性誘發因子與潛在疾病背景的趨勢，下列敘述何者正確？",o:["B 型肝炎病毒 (HBV) 的急性發作依然不受控制，目前仍佔據所有亞洲 ACLF 急性損傷的 80% 以上。","酒精性肝炎 (Alcoholic hepatitis) 已急速竄升，成為亞洲部分已開發地區急性損傷的首要原因。","代謝功能障礙相關脂肪性肝病 (MASLD) 導致的 ACLF，因發炎反應較輕微，其短期死亡率顯著低於其他病因。","亞洲地區的 ACLF 病患極少見到由藥物性肝損傷 (DILI) 所引發，此為西方國家特有的現象。","由於公共衛生的進步，目前引發亞洲 ACLF 的最主要原因為自體免疫肝炎 (AIH) 的急性發作。"],a:1,e:"近年亞洲 ACLF 病因結構改變：酒精性肝炎比例顯著上升，成為部分已開發國家（如日本、南韓、新加坡）的首要原因；HBV 仍重要但不再佔 80% 以上；MASLD 相關 ACLF 預後與其他病因相近或更差；DILI 在亞洲並不少見；AIH 非主要原因。"},
{q:"針對 ACLF 患者使用「5% 白蛋白置換液血漿交換 (PE-A5%)」作為橋接療法，其潛在的治療優勢「不包含」下列何者？",o:["能夠高效率地移除體內與白蛋白結合的毒素（如膽紅素、膽汁酸）與內毒素。","能夠清除血液中大量的損傷相關分子模式 (DAMPs) 與發炎細胞激素 (如 IL-6、TNF-α)。","透過輸注全新的功能性白蛋白，能改善全身血流動力學並降低血清肌酸酐，有助於逆轉早期的急性腎損傷。","能夠完全且永久性地修復腸黏膜的緊密連接 (Tight junctions)，從根本上根除腸漏症 (Leaky gut) 的問題。","搭配適量的新鮮冷凍血漿 (FFP)，能幫助改善單核球的吞噬與清除細菌功能，部分逆轉免疫麻痺狀態。"],a:3,e:"PE-A5% 無法「完全且永久性」修復腸黏膜緊密連接，腸漏症需綜合治療（控制感染、減少腸道壓力、益生菌等）。"},
{q:"肝臟移植是重度 ACLF 唯一能提供長期存活的根治性療法，但若在不適當的時機進行將面臨極高的術後死亡率。根據京都共識，下列何者「不屬於」肝臟移植的絕對禁忌症或無效醫療 (Futility) 的指標？",o:["患者合併無法控制的進行性敗血症或多重抗藥性細菌感染。","動脈血乳酸濃度持續升高且大於 9 mmol/L。","發生 4 個或 4 個以上的器官衰竭。","疾病嚴重度評估顯示 AARC 評分大於 13 分。","出現肝性腦病變 (West-Haven Grade II)，但循環狀態穩定且無需使用機械通氣（插管）。"],a:4,e:"禁忌/無效指標：無法控制的敗血症/多重抗藥性感染、乳酸 > 9 mmol/L 持續升高、≥4 個器官衰竭、AARC 評分 > 13。West-Haven Grade II 肝性腦病變若循環穩定且無需插管，並非絕對禁忌，仍可評估移植。"}
]},

/* ---------- 工具 ---------- */
const $=id=>document.getElementById(id);
const KEY="gi-quiz-wrong-v1";
let wrongSet=new Set();
try{wrongSet=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));}catch(e){}
function saveWrong(){try{localStorage.setItem(KEY,JSON.stringify([...wrongSet]));}catch(e){}}
function show(id){["setup","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let selected=new Set(DATA.map((_,i)=>i));
let mode="order",src="all";
let queue=[],cur=0,score=0,answered=false,sessionWrong=[];

/* ---------- 設定畫面 ---------- */
$("total").textContent=DATA.reduce((n,s)=>n+s.qs.length,0);
function renderChips(){
  $("chips").innerHTML="";
  DATA.forEach((s,i)=>{
    const l=document.createElement("label");
    l.className="chip"+(selected.has(i)?" on":"");
    const wc=s.qs.filter((_,j)=>wrongSet.has(i+"-"+j)).length;
    l.innerHTML=`<input type="checkbox" ${selected.has(i)?"checked":""}><span>${s.name}</span><span class="n">${s.qs.length} 題${wc?` · 錯 ${wc}`:""}</span>`;
    l.querySelector("input").onchange=e=>{e.target.checked?selected.add(i):selected.delete(i);renderChips();};
    $("chips").appendChild(l);
  });
  $("wrongCount").textContent=wrongSet.size;
}
renderChips();
$("selAll").onclick=()=>{selected=new Set(DATA.map((_,i)=>i));renderChips();};
$("selNone").onclick=()=>{selected.clear();renderChips();};
$("clearWrong").onclick=()=>{if(confirm("確定清除所有錯題記錄？")){wrongSet.clear();saveWrong();renderChips();}};
function seg(id,cb){$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{$(id).querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");cb(b.dataset.v);});}
seg("modeSeg",v=>mode=v);
seg("srcSeg",v=>src=v);

$("start").onclick=()=>{
  const items=[];
  DATA.forEach((s,i)=>{if(!selected.has(i))return;s.qs.forEach((_,j)=>{const id=i+"-"+j;if(src==="all"||wrongSet.has(id))items.push({s:i,i:j,id});});});
  if(!items.length){alert(src==="wrong"?"所選單元目前沒有錯題 🎉":"請至少選擇一個單元");return;}
  begin(mode==="random"?shuffle(items):items);
};

/* ---------- 作答 ---------- */
function begin(items){queue=items;cur=0;score=0;sessionWrong=[];show("quiz");renderQ();}
function renderQ(){
  answered=false;
  const it=queue[cur],q=DATA[it.s].qs[it.i];
  $("pos").textContent=`第 ${cur+1} / ${queue.length} 題 · 目前答對 ${score}`;
  $("secTag").textContent=DATA[it.s].name;
  $("pbar").style.width=(cur/queue.length*100)+"%";
  $("qtext").textContent=q.q;
  $("fb").innerHTML="";
  $("next").disabled=true;
  $("next").textContent=cur===queue.length-1?"查看結果":"下一題";
  $("opts").innerHTML="";
  q.o.forEach((t,k)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.innerHTML=`<b>${LET[k]}.</b><span></span>`;
    b.lastChild.textContent=t;
    b.onclick=()=>choose(k);
    $("opts").appendChild(b);
  });
}
function choose(k){
  if(answered)return;answered=true;
  const it=queue[cur],q=DATA[it.s].qs[it.i];
  const ok=k===q.a;
  const btns=$("opts").children;
  [...btns].forEach((b,idx)=>{b.disabled=true;if(idx===q.a)b.classList.add("ok");});
  if(!ok)btns[k].classList.add("bad");
  if(ok){score++;wrongSet.delete(it.id);}else{wrongSet.add(it.id);sessionWrong.push({it,pick:k});}
  saveWrong();
  $("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><strong>${ok?"✅ 答對了！":"❌ 答錯了，正確答案：("+LET[q.a]+")"}</strong>${q.e?"解析："+escapeHtml(q.e):""}</div>`;
  $("pos").textContent=`第 ${cur+1} / ${queue.length} 題 · 目前答對 ${score}`;
  $("next").disabled=false;
}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
$("next").onclick=()=>{if(cur<queue.length-1){cur++;renderQ();}else finish();};
$("quit").onclick=()=>{if(confirm("確定結束本次練習？")){finish();}};
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hidden"))return;
  const k=LET.indexOf(e.key.toUpperCase());
  if(k>=0&&!answered&&k<DATA[queue[cur].s].qs[queue[cur].i].o.length){choose(k);}
  else if((e.key==="Enter"||e.key==="ArrowRight")&&answered){$("next").click();}
});

/* ---------- 結果 ---------- */
function finish(){
  const done=answered?cur+1:cur;
  $("rScore").textContent=score;$("rTotal").textContent=done;
  $("rPct").textContent=done?`正確率 ${Math.round(score/done*100)}%`:"";
  const box=$("wrongList");box.innerHTML="";
  $("wrongBox").classList.toggle("hidden",!sessionWrong.length);
  $("retryWrong").classList.toggle("hidden",!sessionWrong.length);
  sessionWrong.forEach(w=>{
    const q=DATA[w.it.s].qs[w.it.i];
    const d=document.createElement("div");d.className="wl";
    d.innerHTML=`<div class="sub">${DATA[w.it.s].name}</div><div class="qq"></div><div class="you">你的答案：(${LET[w.pick]}) <span class="y"></span></div><div class="ans">正確答案：(${LET[q.a]}) <span class="c"></span></div>${q.e?`<div class="sub" style="margin-top:4px;white-space:pre-line"></div>`:""}`;
    d.querySelector(".qq").textContent=q.q;
    d.querySelector(".y").textContent=q.o[w.pick];
    d.querySelector(".c").textContent=q.o[q.a];
    if(q.e)d.lastChild.textContent="解析："+q.e;
    box.appendChild(d);
  });
  show("result");
}
$("retryWrong").onclick=()=>begin(shuffle(sessionWrong.map(w=>w.it)));
$("home").onclick=()=>{renderChips();show("setup");};
</script>
